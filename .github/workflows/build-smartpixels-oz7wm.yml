name: SmartPixels oz7wm Android 17 APK
on:
  push:
    branches: ['build/smartpixels-oz7wm-a17']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-smartpixels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already ships the Android SDK and sdkmanager.
      # setup-android@v3 currently fails trying to install the removed 'tools' package.
      - name: Android 17 SDK API 37
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "Missing sdkmanager" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
          # Upstream uses compileSdk=37, whereas SDK Manager publishes android-37.0.
          if [ ! -e "$SDKROOT/platforms/android-37" ]; then
            ln -s "$SDKROOT/platforms/android-37.0" "$SDKROOT/platforms/android-37"
          fi
      - name: Extract source patch package
        run: |
          mkdir -p smartpixels
          tar -xJf smartpixels_build_source.tar.xz -C smartpixels
          test -s smartpixels/patch/Oz7wmModuleMain.java
          test -s smartpixels/patch/apply_patch.py
          test -s smartpixels/build.sh
      - name: Build patched SmartPixels and KernelSU module
        run: bash smartpixels/build.sh
      - name: Verify APK and recovery ZIP
        run: |
          test -s smartpixels/out/SmartPixels-oz7wm-A17-rc1.apk
          test -s smartpixels/out/SmartPixels_OZ7WM_A17_KernelSU_Next_rc1.zip
          unzip -t smartpixels/out/SmartPixels_OZ7WM_A17_KernelSU_Next_rc1.zip
          sha256sum smartpixels/out/SmartPixels-oz7wm-A17-rc1.apk
      - name: Publish APK and KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SmartPixels-oz7wm-A17-APK-and-KernelSU
          path: |
            smartpixels/out/SmartPixels-oz7wm-A17-rc1.apk
            smartpixels/out/SmartPixels_OZ7WM_A17_KernelSU_Next_rc1.zip
          if-no-files-found: error
