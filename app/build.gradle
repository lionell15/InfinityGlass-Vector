plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.infinityglass'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leo.infinityglass'
        minSdk 31
        targetSdk 35
        versionCode 14
        versionName '0.14'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
